[package]
name = "mewzak"
version = "0.4.2"
description = "Mewzak — a quiet music player"
authors = ["Mewzak"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mewzak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
